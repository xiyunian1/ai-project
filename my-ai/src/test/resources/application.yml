dify:
  api-key: test-dify-key
  base-url: http://localhost:8080/v1
  mock-enabled: true
  mock-delay-ms: 10
  request-timeout-seconds: 2

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: test-jwt-secret-should-be-at-least-32-bytes
