llm:
  api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
  base-url: ${LLM_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
  model: ${LLM_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
  request-timeout-seconds: ${LLM_REQUEST_TIMEOUT_SECONDS:20}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

analysis:
  custom-db-enabled: ${ANALYSIS_CUSTOM_DB_ENABLED:false}
  agent:
    # tools：原生 Function Calling（默认）；json：旧版 JSON 文本动作，保留用于对照评测
    mode: ${ANALYSIS_AGENT_MODE:tools}
    max-tool-turns: ${ANALYSIS_AGENT_MAX_TOOL_TURNS:8}
    request-timeout-seconds: ${ANALYSIS_AGENT_REQUEST_TIMEOUT_SECONDS:45}

rag:
  # 资料问答检索。未配置 EMBEDDING_API_KEY / RAG_DB_PASSWORD 或向量库不可用时，自动回退为整篇文档拼接上下文
  enabled: ${RAG_ENABLED:true}
  mode: ${RAG_MODE:hybrid_rerank}
  top-k: ${RAG_TOP_K:5}
  candidate-k: ${RAG_CANDIDATE_K:20}
  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5432/wms_rag}
    username: ${RAG_DB_USERNAME:wms_rag}
    password: ${RAG_DB_PASSWORD:}
  embedding:
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  rerank:
    model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:jtds:sqlserver://localhost:1433/myai}
    driver-class-name: ${DB_DRIVER:net.sourceforge.jtds.jdbc.Driver}
    username: ${DB_USERNAME:myai_user}
    password: ${DB_PASSWORD:}
    hikari:
      connection-test-query: SELECT 1
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.community.dialect.SQLServerLegacyDialect}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allow-null-origin: ${CORS_ALLOW_NULL_ORIGIN:false}

auth:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:管理员}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

codex:
  binary: ${CODEX_BINARY:codex.cmd}
  model: ${CODEX_MODEL:gpt-5-codex}
  timeout-seconds: ${CODEX_TIMEOUT_SECONDS:600}
  raw-file-enabled: ${CODEX_RAW_FILE_ENABLED:false}

nl2sql:
  enabled: ${NL2SQL_ENABLED:true}
  provider: ${NL2SQL_PROVIDER:openai-compatible}
  max-rows: ${NL2SQL_MAX_ROWS:200}
  allowed-tables: ${NL2SQL_ALLOWED_TABLES:dbo.inout,aisql.dbo.inout,inout}
